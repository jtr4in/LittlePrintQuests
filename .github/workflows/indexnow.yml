# After a push that changes site pages, tells Bing and the other IndexNow engines which pages changed
# (scripts/indexnow.js). Waits a few minutes first so GitHub Pages has published them.
# Run it by hand with "all" ticked to resubmit every URL in the sitemap.
name: IndexNow
on:
  push:
    branches: [main]
    paths: ['docs/**']
  workflow_dispatch:
    inputs:
      all:
        description: Submit every URL in the sitemap
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for Pages to publish
        run: sleep 180
      - name: Submit changed pages
        env:
          BEFORE: ${{ github.event.before }}
          ALL: ${{ inputs.all }}
        run: |
          if [ "$ALL" = "true" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            node scripts/indexnow.js --all
          else
            node scripts/indexnow.js "$BEFORE..${{ github.sha }}"
          fi
