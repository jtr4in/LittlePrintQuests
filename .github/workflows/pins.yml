# Adds the next Pinterest pins (two per board) to the feeds in docs/pins each morning, then rebuilds the site so
# Pinterest's Auto-publish sees them (pushes made with the workflow token don't start a Pages build).
name: Daily pins
on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/pin-feed.js 2  # two pins per board a day (8 a day; was 1 per board)
      - name: Commit and rebuild the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet docs/pins && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/pins
          git commit -m "Daily pins"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
